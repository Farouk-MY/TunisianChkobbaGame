name: chkobba_tn
description: Traditional Tunisian Chkobba card game
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.5+1

  # Value Equality
  equatable: ^2.0.7

  # Local Storage
  shared_preferences: ^2.5.4
  audioplayers: ^6.5.1

  # Supabase (Online Multiplayer)
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.2

  # Sharing & Deep Links
  share_plus: ^10.1.4
  app_links: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
